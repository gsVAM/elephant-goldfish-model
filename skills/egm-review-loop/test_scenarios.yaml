skill: "egm-review-loop"
description: "Behavioral evaluation scenario suite for egm-review-loop skill."

scenarios:
  - scenario_id: "orchestrate_parallel_critiques"
    description: "Verifies review persona orchestration and findings compilation."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-review-loop/SKILL.md"
    turns:
      - user_input: "Orchestrate multi-perspective Goldfish review on docs/design.md."
        assertions:
          - type: "required_pattern"
            pattern: "(Review|Goldfish|findings|persona|comprehension|critic)"
            message: "Review loop orchestrator must acknowledge review personas and structured findings compilation."

  - scenario_id: "convergence_not_zero_findings"
    description: "Verifies the loop stops on consecutive clean rounds, not on zero findings, and does not re-open settled findings."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-review-loop/SKILL.md"
    turns:
      - user_input: "Round 3 of the review loop on docs/design.md returned two Nits and one Major that was contested in round 1. Round 2 was clean. What happens next?"
        assertions:
          - type: "required_pattern"
            pattern: "(?i)(converged|two consecutive clean|settled)"
            message: "The loop must treat a re-raised settled finding and Nits as non-blocking and report convergence."

  - scenario_id: "missing_reviewer_status_not_clean"
    description: "Verifies a reviewer with no status in the synthesizer summary counts as not run, so a zero-findings round is not clean."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-review-loop/SKILL.md"
    turns:
      - user_input: "The synthesizer summary for round 2 on docs/design.md says: 0 findings; egm-design completed, egm-structural completed. egm-style was also requested. Is round 2 clean?"
        assertions:
          - type: "required_pattern"
            pattern: "(?i)not run"
            message: "A requested reviewer with no status must count as not run, so the round is not clean."

  # Modified by the elephant-goldfish-model Astra fork (gsVAM), 2026: Astra lane scenarios.
  - scenario_id: "astra_lane_failure_is_optional"
    description: "Verifies an Astra lane that did not complete is recorded as not run and does not make the round unclean."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-review-loop/SKILL.md"
    turns:
      - user_input: "Round 2 on docs/design.md, Focused panel: the Claude reviewers completed with two Nits; the Astra lane timed out. Is round 2 clean?"
        assertions:
          - type: "required_pattern"
            pattern: "(?i)not run"
            message: "The Astra lane must be recorded as not run with its reason."
          - type: "required_pattern"
            pattern: "(?i)(clean|claude-only)"
            message: "A lane that did not run does not make the round unclean; the round is judged on the Claude reviewers."

  - scenario_id: "astra_medium_blocks_clean_round"
    description: "Verifies an Astra medium finding maps to Major and blocks a clean round."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-review-loop/SKILL.md"
    turns:
      - user_input: "Round 1 on docs/design.md: the Claude reviewers found only Nits; Astra completed REVISE with one new medium finding. Is the round clean?"
        assertions:
          - type: "required_pattern"
            pattern: "(?i)(major|not clean)"
            message: "An Astra medium finding is a Major and blocks a clean round."
